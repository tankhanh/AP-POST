<div class="container py-5 text-center">
  <div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body p-5">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
      <h2 class="mt-4 fw-bold text-success">Thanh toán thành công!</h2>
      <p class="text-muted">Cảm ơn bạn đã thanh toán qua MOMO.</p>

      <div *ngIf="orderId" class="alert alert-info mt-4">
        <strong>Mã đơn hàng:</strong> {{ orderId }}
      </div>

      <p class="text-muted mt-4">Bạn sẽ được chuyển về danh sách đơn hàng sau <strong>3 giây</strong>...</p>

      <button class="btn btn-success btn-lg px-5" (click)="goToList()">
        Về danh sách đơn hàng ngay
      </button>
    </div>
  </div>
</div>
