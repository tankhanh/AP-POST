<div class="payment-result-container">
  <section class="result-section text-center">
    <div *ngIf="isSuccess; else failedTemplate">
      <div class="status-icon success-icon">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <h1 class="success-title">Thanh toán thành công.</h1>
      <p class="success-subtitle">Cảm ơn bạn đã thanh toán qua MoMo.</p>
      <div class="receipt-card">
        <div class="receipt-body">
          <div class="receipt-row">
            <span class="receipt-label">Mã đơn hàng</span>
            <span class="receipt-value">{{ orderId }}</span>
          </div>
        </div>
      </div>
    </div>

    <ng-template #failedTemplate>
      <div class="status-icon failed-icon">
        <i class="bi bi-x-circle-fill"></i>
      </div>
      <h1 class="failed-title">Thanh toán chưa hoàn tất.</h1>
      <p class="failed-subtitle">Vui lòng kiểm tra lại hoặc thử thanh toán lần nữa.</p>
      <div class="receipt-card">
        <div class="receipt-body">
          <div class="receipt-row">
            <span class="receipt-label">Mã đơn hàng</span>
            <span class="receipt-value">{{ orderId }}</span>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="actions">
      <button class="btn btn-primary btn-lg w-100" (click)="goToList()">
        Về danh sách đơn hàng
      </button>
    </div>

    <small class="text-muted d-block mt-4">Tự động chuyển sau 4 giây.</small>
  </section>
</div>
