<div class="container py-5 text-center">
  <div class="card shadow mx-auto" style="max-width: 500px">
    <div class="card-body p-5">
      <i class="bi bi-check-circle-fill text-success" style="font-size: 4.5rem"></i>

      <h2 class="mt-4 fw-bold text-success" *ngIf="resultCode === 0; else failed">
        Thanh toán thành công!
      </h2>

      <ng-template #failed>
        <h2 class="mt-4 fw-bold text-danger">Thanh toán chưa hoàn tất</h2>
      </ng-template>

      <p class="text-muted mt-3">
        Mã đơn hàng: <strong>{{ orderId }}</strong>
      </p>

      <div class="mt-4">
        <button class="btn btn-success btn-lg px-5" (click)="goToList()">
          Về danh sách đơn hàng
        </button>
      </div>

      <small class="text-muted d-block mt-4"> Bạn sẽ được chuyển tự động sau 3 giây... </small>
    </div>
  </div>
</div>
