<div class="container py-5 text-center">
  <div class="card shadow mx-auto" style="max-width: 520px">
    <div class="card-body p-5">
      <div *ngIf="isSuccess; else failedTemplate">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem"></i>
        <h2 class="mt-4 fw-bold text-success">Thanh toán thành công!</h2>
        <p class="text-muted mt-2">Cảm ơn bạn đã thanh toán qua MoMo.</p>
        <p class="mt-3"><strong>Mã đơn hàng:</strong> {{ orderId }}</p>
      </div>

      <ng-template #failedTemplate>
        <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem"></i>
        <h2 class="mt-4 fw-bold text-danger">Thanh toán chưa hoàn tất</h2>
        <p class="text-muted mt-2">Vui lòng kiểm tra lại hoặc thử thanh toán lần nữa.</p>
        <p class="mt-3"><strong>Mã đơn hàng:</strong> {{ orderId }}</p>
      </ng-template>

      <div class="mt-4">
        <button class="btn btn-success btn-lg px-5" (click)="goToList()">
          Về danh sách đơn hàng
        </button>
      </div>

      <small class="text-muted d-block mt-4"> Tự động chuyển sau 4 giây... </small>
    </div>
  </div>
</div>
