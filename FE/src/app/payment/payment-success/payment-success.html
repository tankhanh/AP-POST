<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card border-0 rounded-4 shadow-sm" style="max-width: 500px; width: 92%;">
    <div class="card-body p-5 text-center">

      <!-- Icon check xám lớn (giống ảnh bạn gửi) -->
      <div class="mb-5">
        <i class="bi bi-check-circle-fill text-secondary" style="font-size: 80px;"></i>
      </div>

      <!-- Tiêu đề lớn màu xanh lá -->
      <h1 class="mb-2 fw-bold text-success" style="font-size: 2.8rem;">
        Thanh toán<br>thành công!
      </h1>

      <!-- Thông báo phụ (giống ảnh) -->
      <p class="text-muted mb-5">Thanh toán thành công</p>

      <!-- Box mã vận đơn trắng bo góc lớn -->
      @if (status === 'paid' && waybill && waybill !== 'N/A') {
        <div class="bg-white border rounded-4 shadow-sm p-4 mb-5">
          <p class="small text-uppercase text-muted mb-2">Mã vận đơn</p>
          <h3 class="fw-bold text-success mb-0" style="font-size: 2rem; letter-spacing: 3px;">
            {{ waybill }}
          </h3>
        </div>
      }

      <!-- Nút hành động -->
      <div class="d-grid gap-3">
        <button class="btn btn-success btn-lg rounded-pill shadow-sm" (click)="goHome()">
          Tạo đơn mới
        </button>
        <button class="btn btn-outline-success rounded-pill">
          Xem danh sách đơn hàng
        </button>
      </div>

      <!-- Footer cảm ơn -->
      <p class="text-muted mt-5 small">
        Cảm ơn bạn đã sử dụng <strong class="text-success">AP Post</strong>
      </p>

    </div>
  </div>
</div>
