<div class="ap-dashboard-shell">
  <aside class="ap-sidebar" [class.collapsed]="!sidebarOpen && innerWidth < 992">
    <div class="ap-sidebar-inner">
      <a [routerLink]="['/']" class="ap-sidebar-brand">
        <span class="ap-brand-mark">AP</span>
        <span class="ap-brand-text">Admin</span>
      </a>

      <nav class="ap-sidebar-nav">
        <div class="ap-sidebar-section">Tổng quan</div>
        <a [routerLink]="['/admin/dashboard']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:view-dashboard-outline"></iconify-icon>
          <span>Dashboard</span>
        </a>

        <div class="ap-sidebar-section">Vận hành</div>
        <a [routerLink]="['/admin/orders/list']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:package-variant-closed"></iconify-icon>
          <span>Đơn hàng</span>
        </a>
        <a [routerLink]="['/admin/branch']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:office-building-marker-outline"></iconify-icon>
          <span>Chi nhánh</span>
        </a>
        <a [routerLink]="['/admin/staff']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:account-group-outline"></iconify-icon>
          <span>Nhân viên</span>
        </a>

        <div class="ap-sidebar-section">Cấu hình</div>
        <a [routerLink]="['/admin/pricing']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:tag-multiple-outline"></iconify-icon>
          <span>Dịch vụ & giá</span>
        </a>
        <a [routerLink]="['/admin/support']" routerLinkActive="active" class="nav-link">
          <iconify-icon icon="mdi:headset"></iconify-icon>
          <span>Hỗ trợ</span>
        </a>
      </nav>

      <div class="ap-sidebar-user">
        <div class="d-flex align-items-center gap-3 mb-3">
          <span class="ap-avatar">
            <iconify-icon icon="mdi:shield-account"></iconify-icon>
          </span>
          <div class="min-w-0">
            <div class="fw-bold text-truncate">{{ user?.name || 'Admin' }}</div>
            <div class="text-muted small text-truncate">{{ user?.email || 'admin@appost.com' }}</div>
          </div>
        </div>
        <button (click)="logout()" class="btn btn-secondary btn-sm w-100">
          <iconify-icon icon="mdi:logout"></iconify-icon>
          Đăng xuất
        </button>
      </div>
    </div>
  </aside>

  <main class="ap-main">
    <div class="ap-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-secondary d-lg-none" (click)="toggleSidebar()" aria-label="Mở sidebar">
          <iconify-icon icon="mdi:menu"></iconify-icon>
        </button>
        <div>
          <div class="ap-dashboard-kicker">AP Post</div>
          <strong>Trung tâm quản trị</strong>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <a [routerLink]="['/tracking']" class="btn btn-secondary btn-sm">
          <iconify-icon icon="mdi:magnify-scan"></iconify-icon>
          Tra cứu
        </a>
        <button (click)="logout()" class="btn btn-primary btn-sm">
          <iconify-icon icon="mdi:logout"></iconify-icon>
          Thoát
        </button>
      </div>
    </div>

    <div class="ap-page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
