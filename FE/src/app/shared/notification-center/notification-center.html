<div class="notification-center position-relative">
  <button
    type="button"
    class="btn btn-outline-secondary notification-trigger"
    (click)="toggle($event)"
    [attr.aria-expanded]="open"
    aria-haspopup="dialog"
    aria-label="Thông báo"
  >
    <iconify-icon icon="mdi:bell-outline"></iconify-icon>
    <span class="visually-hidden">Thông báo</span>
    <span *ngIf="unreadCount > 0" class="badge bg-danger rounded-pill">{{ unreadCount }}</span>
  </button>

  <div *ngIf="open" class="notification-backdrop" (click)="toggle()" aria-hidden="true"></div>

  <section
    *ngIf="open"
    class="notification-list card position-absolute"
    role="dialog"
    aria-label="Danh sách thông báo"
  >
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <strong>Thông báo</strong>
        <small class="text-muted ms-1">{{ unreadCount ? unreadCount + ' mới' : '' }}</small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          (click)="toggleMute($event)"
          [attr.aria-label]="muted ? 'Bật âm thanh thông báo' : 'Tắt âm thanh thông báo'"
          [title]="muted ? 'Bật âm thanh' : 'Tắt âm thanh'"
        >
          <iconify-icon [icon]="muted ? 'mdi:volume-off' : 'mdi:volume-high'"></iconify-icon>
        </button>
        <button
          type="button"
          class="btn btn-sm btn-link mark-all"
          (click)="markAllRead()"
          [disabled]="!unreadCount"
        >
          Đọc tất cả
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary close-btn"
          (click)="toggle($event)"
          aria-label="Đóng thông báo"
        >
          <iconify-icon icon="mdi:close"></iconify-icon>
        </button>
      </div>
    </div>
    <div class="card-body p-0">
      <div *ngIf="loading" class="notification-state" role="status">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        Đang tải thông báo
      </div>
      <ul *ngIf="!loading" class="list-unstyled mb-0">
        <li *ngIf="notifications.length === 0" class="notification-state" role="status">
          <iconify-icon icon="mdi:bell-sleep-outline"></iconify-icon>
          <span>Chưa có thông báo.</span>
        </li>
        <li *ngFor="let n of notifications" class="notification-item p-3 border-bottom d-flex">
          <div class="flex-grow-1">
            <button type="button" class="notification-link" (click)="openNotification(n)">
              <strong>{{ n.title }}</strong>
            </button>
            <div class="small text-muted notif-msg">{{ n.message }}</div>
            <div class="small text-muted mt-1">{{ n.createdAt | date: 'dd/MM/yyyy HH:mm' }}</div>
          </div>
          <div class="ms-2 text-end d-flex flex-column align-items-end">
            <div *ngIf="n.status === 'PENDING' && !n.readAt">
              <button
                type="button"
                class="btn btn-sm btn-outline-primary"
                (click)="markRead(n, $event)"
              >
                Đã đọc
              </button>
            </div>
            <div *ngIf="n.status !== 'PENDING' || n.readAt" class="small text-success">Đã đọc</div>
            <button
              type="button"
              class="btn btn-sm btn-outline-danger mt-2"
              (click)="removeNotification(n, $event)"
            >
              Xóa
            </button>
          </div>
        </li>
      </ul>
    </div>
  </section>
</div>
