<div class="modal-header border-0 pb-0">
  <h4 class="modal-title fw-bold text-primary">
    Thanh toán bằng thẻ
  </h4>
  <button type="button" class="btn-close" (click)="cancel.emit()" aria-label="Close"></button>
</div>

<div class="modal-body pt-2">
  <div class="text-center mb-4">
    <i class="bi bi-credit-card-2-front-fill card-icon"></i>
    <p class="h5 mt-3 text-muted">Số tiền thanh toán</p>
    <h3 class="fw-bold text-primary">{{ amount | number:'1.0-0' }} ₫</h3>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label fw-semibold">Số thẻ</label>
      <input type="text" class="form-control form-control-lg" [(ngModel)]="cardData.card_number"
             placeholder="4242 4242 4242 4242" maxlength="19" name="card_number">
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Tên chủ thẻ</label>
      <input type="text" class="form-control form-control-lg" [(ngModel)]="cardData.card_holder_name"
             placeholder="NGUYEN VAN A" name="card_holder_name">
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold">Tháng/Năm hết hạn</label>
        <div class="input-group">
          <input type="text" class="form-control form-control-lg text-center" [(ngModel)]="cardData.expiryMonth"
                 placeholder="MM" maxlength="2" name="expiryMonth">
          <span class="input-group-text">/</span>
          <input type="text" class="form-control form-control-lg text-center" [(ngModel)]="cardData.expiryYear"
                 placeholder="YYYY" maxlength="4" name="expiryYear">
        </div>
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">CVV</label>
        <input type="text" class="form-control form-control-lg text-center" [(ngModel)]="cardData.cvv"
               placeholder="123" maxlength="4" name="cvv">
      </div>
    </div>

    <div class="d-grid gap-3 mt-4">
      <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">
        Thanh toán {{ amount | number:'1.0-0' }} ₫
      </button>
      <button type="button" class="btn btn-outline-secondary btn-lg rounded-pill"
              (click)="cancel.emit()">
        Hủy bỏ
      </button>
    </div>
  </form>
</div>
