<section class="auth-page">
  <div class="container">
    <div class="auth-card auth-card-narrow">
      <a href="/" class="auth-brand">
        <span class="ap-brand-mark">AP</span>
        <span class="ap-brand-text">AP Post</span>
      </a>

      <h2>Xác nhận tài khoản.</h2>
      <p class="mb-4">Nhập mã xác nhận đã được gửi tới email đăng ký.</p>

      <form class="auth-form">
        <div>
          <label class="form-label" for="verifyCode">Mã xác nhận</label>
          <input
            id="verifyCode"
            type="text"
            class="form-control"
            [(ngModel)]="code"
            name="code"
            placeholder="Nhập mã"
          />
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger mb-0">{{ errorMessage }}</div>
        }

        @if (successMessage) {
          <div class="alert alert-success mb-0">{{ successMessage }}</div>
        }

        <button type="button" class="btn btn-primary btn-lg w-100" (click)="verifyCode()">
          Xác nhận
        </button>
      </form>
    </div>
  </div>
</section>
