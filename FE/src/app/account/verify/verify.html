<section class="auth-page">
  <div class="container">
    <div class="auth-card auth-card-narrow">
      <a [routerLink]="['/register']" class="auth-back-link">
        <span class="auth-back-arrow" aria-hidden="true">←</span>
        <span>Quay lại</span>
      </a>
      <a [routerLink]="['/']" class="auth-brand">
        <span class="ap-brand-mark">AP</span>
        <span class="ap-brand-text">AP Post</span>
      </a>

      <h2>Xác nhận tài khoản.</h2>
      <p class="mb-4">Nhập mã xác nhận đã được gửi tới email đăng ký.</p>

      <form class="auth-form" (ngSubmit)="verifyCode()">
        <div>
          <label class="form-label" for="verifyCode">Mã xác nhận</label>
          <input
            id="verifyCode"
            type="text"
            class="form-control"
            [(ngModel)]="code"
            name="code"
            placeholder="Nhập mã"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
          />
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger mb-0" role="alert" aria-live="polite">
            {{ errorMessage }}
          </div>
        }

        @if (successMessage) {
          <div class="alert alert-success mb-0" role="status" aria-live="polite">
            {{ successMessage }}
          </div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100">Xác nhận</button>
      </form>

      @if (!successMessage) {
        <div class="text-center mt-3">
          <button
            type="button"
            class="btn btn-link"
            (click)="retryCode()"
            [disabled]="isResending"
          >
            @if (!isResending) {
              <iconify-icon icon="mdi:email-sync"></iconify-icon>
              Gửi lại mã xác nhận
            } @else {
              <iconify-icon
                icon="mdi:loading"
                class="animate-spin"
                aria-hidden="true"
              ></iconify-icon>
              Đang gửi...
            }
          </button>
        </div>
      }
    </div>
  </div>
</section>
