<section class="auth-page">
  <div class="container">
    <div class="auth-card auth-card-narrow">
      <a [routerLink]="['/']" class="auth-brand">
        <span class="ap-brand-mark">AP</span>
        <span class="ap-brand-text">AP Post</span>
      </a>

      <h2>Quên mật khẩu?</h2>
      <p class="mb-4">Nhập email để nhận mã xác nhận đặt lại mật khẩu.</p>

      <form class="auth-form" (ngSubmit)="sendResetLink()">
        <div>
          <label class="form-label" for="forgotEmail">Email</label>
          <input
            type="email"
            class="form-control"
            id="forgotEmail"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          Gửi mã xác nhận
        </button>
      </form>

      @if (successMessage) {
        <div class="alert alert-success mt-3">{{ successMessage }}</div>
      }
      @if (errorMessage) {
        <div class="alert alert-danger mt-3">{{ errorMessage }}</div>
      }

      <p class="text-center mt-4 mb-0">
        Bạn đã nhớ mật khẩu?
        <a class="fw-bold" [routerLink]="['/login']">Đăng nhập</a>
      </p>
    </div>
  </div>
</section>
