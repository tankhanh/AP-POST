<section class="auth-page">
  <div class="container">
    <div class="auth-card auth-card-narrow">
      <a [routerLink]="['/verify-reset']" class="auth-back-link">
        <span class="auth-back-arrow" aria-hidden="true">←</span>
        <span>Quay lại</span>
      </a>
      <a [routerLink]="['/']" class="auth-brand">
        <span class="ap-brand-mark">AP</span>
        <span class="ap-brand-text">AP Post</span>
      </a>

      <h2>Đặt lại mật khẩu.</h2>
      <p class="mb-4">Tạo mật khẩu mới cho tài khoản của bạn.</p>

      <form class="auth-form" (ngSubmit)="resetPassword()">
        <div>
          <label class="form-label" for="newPassword">Mật khẩu mới</label>
          <input
            id="newPassword"
            type="password"
            class="form-control"
            placeholder="Mật khẩu mới"
            [(ngModel)]="newPassword"
            name="newPassword"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <div>
          <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
          <input
            id="confirmPassword"
            type="password"
            class="form-control"
            placeholder="Nhập lại mật khẩu"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Đổi mật khẩu</button>
      </form>

      @if (message) {
        <div class="alert alert-success mt-3" role="status" aria-live="polite">{{ message }}</div>
      }
      @if (errorMessage) {
        <div class="alert alert-danger mt-3" role="alert" aria-live="polite">
          {{ errorMessage }}
        </div>
      }
    </div>
  </div>
</section>
