<div class="ap-dashboard-header">
  <div>
    <div class="ap-dashboard-kicker">Nhân viên</div>
    <h1 class="ap-dashboard-title">Tổng quan vận hành</h1>
  </div>

  <div class="ap-filter-controls">
    <div class="ap-filter-control">
      <label for="monthSelect">Tháng</label>
      <select
        id="monthSelect"
        class="form-select form-select-sm w-auto"
        [(ngModel)]="selectedMonth"
        [disabled]="viewAllYear"
        (ngModelChange)="onMonthOrYearChange()"
      >
        <option *ngFor="let m of monthOptions" [value]="m.value">{{ m.label }}</option>
      </select>
    </div>

    <div class="ap-filter-control">
      <label for="yearSelect">Năm</label>
      <select
        id="yearSelect"
        class="form-select form-select-sm w-auto"
        [(ngModel)]="selectedYear"
        (change)="onMonthOrYearChange()"
      >
        <option *ngFor="let y of yearOptions" [value]="y">{{ y }}</option>
      </select>
    </div>

    <div class="form-check form-switch ms-1">
      <input
        class="form-check-input"
        type="checkbox"
        id="viewAllYear"
        [(ngModel)]="viewAllYear"
        (change)="onMonthOrYearChange()"
      />
      <label class="form-check-label" for="viewAllYear">Toàn năm</label>
    </div>
  </div>
</div>

<div class="ap-metrics-grid">
  <section class="ap-metric-card" *ngFor="let card of summaryCards">
    <span class="ap-metric-icon">
      <iconify-icon [icon]="card.icon"></iconify-icon>
    </span>
    <div>
      <div class="ap-metric-label">{{ card.label }}</div>
      <div class="ap-metric-value" [ngClass]="card.textClass">{{ card.value }}</div>
    </div>
  </section>
</div>

<div class="ap-chart-grid">
  <section class="ap-chart-card">
    <h3>Đơn hàng theo ngày</h3>
    <div class="ap-chart-frame is-short">
      <canvas #orderChartCanvas></canvas>
    </div>
  </section>

  <section class="ap-chart-card">
    <h3>Tỷ lệ trạng thái</h3>
    <div class="ap-chart-frame is-short">
      <canvas #statusChartCanvas></canvas>
    </div>
  </section>
</div>
