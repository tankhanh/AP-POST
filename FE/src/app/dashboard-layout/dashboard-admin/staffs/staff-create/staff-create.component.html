<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="ap-dashboard-header">
        <div>
          <div class="ap-dashboard-kicker">Quản trị nhân sự</div>
          <h1 class="ap-dashboard-title">Thêm nhân viên.</h1>
        </div>
        <button class="btn btn-secondary" (click)="backToList()" type="button">
          <iconify-icon icon="mdi:arrow-left"></iconify-icon>
          Quay lại
        </button>
      </div>

      <div class="ap-form-panel">
          <form [formGroup]="addForm" (ngSubmit)="save()" method="post">
            <div class="row g-3">
              <!-- Họ tên -->
              <div class="col-md-6">
                <label class="form-label" for="staff-name">
                  Họ tên nhân viên <span class="text-danger">*</span>
                </label>
                <input
                  id="staff-name"
                  type="text"
                  class="form-control"
                  formControlName="name"
                  placeholder="VD: Nguyễn Văn A"
                  autocomplete="name"
                />
                <div
                  class="text-danger small"
                  *ngIf="addForm.get('name')?.invalid && addForm.get('name')?.touched"
                >
                  Vui lòng nhập họ tên nhân viên
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label class="form-label" for="staff-email">
                  Email đăng nhập <span class="text-danger">*</span>
                </label>
                <input
                  id="staff-email"
                  type="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="VD: nv.a@company.com"
                  autocomplete="email"
                />
                <div
                  class="text-danger small"
                  *ngIf="addForm.get('email')?.invalid && addForm.get('email')?.touched"
                >
                  Vui lòng nhập email hợp lệ
                </div>
              </div>

              <!-- Chi nhánh -->
              <div class="col-md-6">
                <label class="form-label" for="staff-branch">
                  Chi nhánh làm việc <span class="text-danger">*</span>
                </label>
                <select id="staff-branch" class="form-select" formControlName="branchId">
                  <option value="">Chọn chi nhánh</option>
                  <option *ngFor="let b of branches" [value]="b._id">
                    {{ b.name }}
                  </option>
                </select>
                <div
                  class="text-danger small"
                  *ngIf="addForm.get('branchId')?.invalid && addForm.get('branchId')?.touched"
                >
                  Vui lòng chọn chi nhánh
                </div>
              </div>

              <!-- Trạng thái -->
              <div class="col-md-6">
                <div class="form-label d-block">Trạng thái</div>
                <div class="form-check form-switch">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="isActiveSwitch"
                    formControlName="isActive"
                  />
                  <label class="form-check-label" for="isActiveSwitch">
                    <span *ngIf="addForm.get('isActive')?.value">Đang hoạt động</span>
                    <span *ngIf="!addForm.get('isActive')?.value">Tạm khoá</span>
                  </label>
                </div>
              </div>

              <!-- Mật khẩu -->
              <div class="col-md-6">
                <label class="form-label" for="staff-password">
                  Mật khẩu <span class="text-danger">*</span>
                </label>
                <input
                  id="staff-password"
                  type="password"
                  class="form-control"
                  formControlName="password"
                  autocomplete="new-password"
                />
                <div
                  class="text-danger small"
                  *ngIf="addForm.get('password')?.invalid && addForm.get('password')?.touched"
                >
                  Mật khẩu phải có từ 8 đến 72 ký tự
                </div>
              </div>

              <!-- Xác nhận mật khẩu -->
              <div class="col-md-6">
                <label class="form-label" for="staff-confirm-password">
                  Xác nhận mật khẩu <span class="text-danger">*</span>
                </label>
                <input
                  id="staff-confirm-password"
                  type="password"
                  class="form-control"
                  formControlName="confirmPassword"
                  autocomplete="new-password"
                />
                <div
                  class="text-danger small"
                  *ngIf="
                    addForm.hasError('passwordMismatch') && addForm.get('confirmPassword')?.touched
                  "
                >
                  Mật khẩu xác nhận không khớp
                </div>
              </div>
            </div>

            <div class="mt-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" (click)="backToList()">
                Hủy
              </button>

              <button type="submit" class="btn btn-primary" [disabled]="addForm.invalid || loading">
                <iconify-icon icon="mdi:account-plus"></iconify-icon>
                <span *ngIf="!loading">Lưu nhân viên</span>
                <span *ngIf="loading">Đang lưu...</span>
              </button>
            </div>
          </form>
      </div>
    </div>
  </div>
</div>
