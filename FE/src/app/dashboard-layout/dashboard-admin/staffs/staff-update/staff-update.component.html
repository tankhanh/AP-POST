<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="ap-dashboard-header">
        <div>
          <div class="ap-dashboard-kicker">Quản trị nhân sự</div>
          <h1 class="ap-dashboard-title">Cập nhật nhân viên.</h1>
        </div>
        <button class="btn btn-secondary" (click)="backToList()" type="button">
          <iconify-icon icon="mdi:arrow-left"></iconify-icon>
          Quay lại
        </button>
      </div>

      <div class="ap-form-panel">
        <form method="post" [formGroup]="editForm" (ngSubmit)="update()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="staff-name">
                Họ và tên <span class="text-danger">*</span>
              </label>
              <input
                id="staff-name"
                type="text"
                class="form-control"
                formControlName="name"
                placeholder="VD: Nguyễn Văn A"
                autocomplete="name"
              />
                <div
                  class="text-danger small"
                  *ngIf="editForm.get('name')?.invalid && editForm.get('name')?.touched"
                >
                  Vui lòng nhập họ tên nhân viên
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label class="form-label" for="staff-email">
                  Email <span class="text-danger">*</span>
                </label>
                <input
                  id="staff-email"
                  type="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="VD: nv.a@domain.com"
                  [readonly]="true"
                  autocomplete="email"
                />
                <div
                  class="text-danger small"
                  *ngIf="editForm.get('email')?.invalid && editForm.get('email')?.touched"
                >
                  Vui lòng nhập email hợp lệ
                </div>
              </div>

              <!-- Chi nhánh -->
              <div class="col-md-6">
                <label class="form-label" for="staff-branch">
                  Chi nhánh làm việc <span class="text-danger">*</span>
                </label>
                <select id="staff-branch" class="form-select" formControlName="branchId">
                  <option value="">Chọn chi nhánh</option>
                  <option *ngFor="let b of branches" [value]="b._id">
                    {{ b.name }}
                  </option>
                </select>
                <div
                  class="text-danger small"
                  *ngIf="editForm.get('branchId')?.invalid && editForm.get('branchId')?.touched"
                >
                  Vui lòng chọn chi nhánh
                </div>
              </div>

              <!-- Trạng thái hoạt động -->
              <div class="col-12 mt-2">
                <div class="form-check">
                  <input
                    id="isActive"
                    type="checkbox"
                    class="form-check-input"
                    formControlName="isActive"
                  />
                  <label class="form-check-label" for="isActive">
                    Tài khoản nhân viên đang hoạt động
                  </label>
                </div>
              </div>
            </div>

            <!-- Thông báo lỗi chung -->
            <div class="mt-2 text-danger small" *ngIf="msg">
              {{ msg }}
            </div>

            <div class="mt-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" (click)="backToList()">
                Hủy
              </button>

              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="editForm.invalid || loading"
              >
                <iconify-icon icon="mdi:content-save"></iconify-icon>
                <span *ngIf="!loading">Lưu thay đổi</span>
                <span *ngIf="loading">Đang lưu...</span>
              </button>
            </div>
          </form>
      </div>
    </div>
  </div>
</div>
